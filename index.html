<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Log">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f5e'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Daily Log</title>
<style>
:root{
  --bg:#f5f4ef;--card:#ffffff;--card2:#f8f7f3;--ink:#1d1d1b;--ink2:#4a4a46;--mute:#74736d;--line:#e6e4dc;
  --accent:#2f6f5e;--accent-soft:#e2eee8;--on-accent:#ffffff;--warn:#a5481d;--warn-soft:#fbeee6;
  --shadow:0 1px 2px rgba(20,20,10,.04),0 4px 14px rgba(20,20,10,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211;--card:#1c1c1a;--card2:#242422;--ink:#eeede8;--ink2:#cac9c2;--mute:#9a9992;--line:#34332f;
  --accent:#62bba2;--accent-soft:#1d3530;--on-accent:#0c1a16;--warn:#ec9a68;--warn-soft:#3a2418;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;line-height:1.25}

/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.top-row .when{flex:1;min-width:0}
.when h1{font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when .rel{font-size:.82rem;color:var(--mute)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.2rem;line-height:1;flex:none}
.icon-btn:disabled{opacity:.35;cursor:default}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem}
.ring .trk{fill:none;stroke:var(--line);stroke-width:5}
.ring .val{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wd{border:0;background:none;padding:4px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mute)}
.wd:disabled{opacity:.35;cursor:default}
.wd .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;color:var(--ink);background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative}
.wd .n::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.wd .n span{position:relative}
.wd.sel .n::before{background:var(--accent)}
.wd.sel .n span{color:var(--on-accent);font-weight:600}
.wd.today{color:var(--accent);font-weight:600}
.jump{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;margin-left:6px}

/* cards & fields */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:1.05rem}
.card-h .sub{margin:2px 0 0;font-size:.8rem;color:var(--mute)}
.pill{font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mute);white-space:nowrap;flex:none}
.pill.full{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.f{margin-top:14px}
.f:first-of-type{margin-top:0}
.lbl{font-size:.82rem;color:var(--ink2);margin-bottom:6px;font-weight:500}
.hint{font-size:.78rem;color:var(--mute);margin:6px 0 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
.two .f{margin-top:0}
.two+.f,.f+.two{margin-top:14px}
input[type=text],input[type=number],input[type=time],input:not([type]),textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:76px;resize:vertical}
.tf{display:flex;gap:6px}
.tf input{flex:1;min-width:0}
.two .tf{flex-direction:column}
.two .tf .now{min-height:34px}
.now{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 10px;font-size:.8rem;color:var(--accent);font-weight:600;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:.88rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chips.sm .chip{min-height:32px;padding:4px 10px;font-size:.8rem}
.chip.add{border-style:dashed;color:var(--ink2)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
.scale b{font-size:1rem}
.scale span{font-size:.66rem;color:var(--mute);line-height:1.15;text-align:center}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale button.on span{color:var(--on-accent);opacity:.9}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden;min-height:44px}
.step button{border:0;background:none;width:46px;font-size:1.3rem;color:var(--accent);flex:none}
.step button:active{background:var(--accent-soft)}
.sv{flex:1;display:grid;place-items:center;font-weight:600;font-size:.92rem;text-align:center;padding:0 4px}
.sv.empty{color:var(--mute);font-weight:400}
.summary{margin-top:14px;padding:12px;border-radius:14px;background:var(--accent-soft);display:flex;gap:14px;align-items:center}
.summary.plain{background:var(--card2)}
.summary .big{font-size:2rem;font-weight:700;color:var(--accent);line-height:1}
.summary .big small{font-size:.8rem;color:var(--mute);font-weight:500}
.summary .k{font-weight:600}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.82rem}

/* meals */
.meal{border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--card2)}
.meal summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.meal summary::-webkit-details-marker{display:none}
.meal summary .mn{font-weight:600;min-width:0;flex:1}
.meal summary .mp{display:block;font-weight:400;font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal summary .mt{font-size:.8rem;color:var(--mute)}
.meal summary .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.meal.has summary .dot{background:var(--accent);border-color:var(--accent)}
.meal summary .chev{color:var(--mute);transition:transform .2s}
.meal[open] summary .chev{transform:rotate(90deg)}
.meal .body{padding:0 12px 12px}
.meal .body>*+*{margin-top:10px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:.82rem;padding:4px 0}

/* habits */
.hab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;margin-top:8px}
.hab .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.8rem;color:transparent}
.hab.on{border-color:var(--accent);background:var(--accent-soft)}
.hab.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:480px}
.nav button{border:0;background:none;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mute)}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);opacity:0;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:.8rem;pointer-events:none;transition:.2s;z-index:7}
.toast.show{opacity:1;transform:translateX(-50%)}

/* insights */
.mnav{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mnav h2{flex:1;text-align:center;font-size:1.05rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card2)}
.tile .tl{font-size:.75rem;color:var(--mute);display:block}
.tile b{display:block;font-size:1.25rem;margin:2px 0;letter-spacing:-.01em}
.tile .td{font-size:.72rem;color:var(--ink2)}
.card h3{font-size:.98rem}
.cap{font-size:.78rem;color:var(--mute);margin:2px 0 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--mute)}
.chart .band{fill:var(--accent-soft)}
.chart .ref{stroke:var(--mute);stroke-width:1;stroke-dasharray:4 4}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.dot,.chart .hit:focus+.dot{r:6}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm .hd{font-size:.7rem;color:var(--mute);text-align:center}
.hc{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.78rem;border:0;padding:0;background:color-mix(in oklab,var(--accent) var(--lv),var(--card2));color:var(--ink)}
.hc.dk{color:var(--on-accent);font-weight:600}
.hc.none{background:transparent;border:1px dashed var(--line);color:var(--mute)}
.hc.blank{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--mute);margin-top:8px;justify-content:flex-end}
.legend i{width:14px;height:14px;border-radius:4px;background:color-mix(in oklab,var(--accent) var(--lv),var(--card2))}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 44px;gap:10px;align-items:center;margin-top:10px;font-size:.85rem}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hb b{text-align:right;font-size:.82rem}
.ins{margin:0;padding:0;list-style:none}
.ins li{padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.ins li:first-child{border-top:0;padding-top:0}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;font-size:.8rem;width:100%}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--card2)}
.empty{text-align:center;color:var(--mute);padding:28px 12px}
#tip{position:fixed;z-index:9;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.78rem;pointer-events:none;white-space:pre-line;max-width:240px}

/* settings */
.hrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow span{flex:1}
.hrow .icon-btn{width:34px;height:34px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:42px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn)}
.prose p{margin:6px 0;font-size:.88rem;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <section id="view-log">
    <div class="top">
      <div class="top-row">
        <button class="icon-btn" id="prev" aria-label="Previous day">‹</button>
        <div class="when"><h1 id="dayTitle"></h1><div class="rel" id="dayRel"></div></div>
        <button class="icon-btn" id="next" aria-label="Next day">›</button>
        <div class="ring" title="How much of today is logged">
          <svg viewBox="0 0 46 46"><circle class="trk" cx="23" cy="23" r="19"/><circle class="val" id="ringVal" cx="23" cy="23" r="19" stroke-dasharray="0 200"/></svg>
          <b id="ringTxt">0%</b>
        </div>
      </div>
      <div class="week" id="week"></div>
    </div>
    <div id="log"></div>
  </section>
  <section id="view-insights" hidden></section>
  <section id="view-settings" hidden></section>
</div>

<nav class="nav"><div class="nav-in">
  <button id="nav-log" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Log</button>
  <button id="nav-insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
  <button id="nav-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast">Saved</div>
<div id="tip" hidden></div>

<script>
/* ---------- storage ---------- */
const KEY='dailylog.v1', SKEY='dailylog.settings.v1';
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let db=read(KEY,{});
const DEFAULT_HABITS=['In bed by bedtime goal','No screens 30 min before bed','Walk / exercise 30 min','8 glasses of water','No junk food'];
let S=Object.assign({habits:DEFAULT_HABITS.slice(),sleepTarget:8,bedTarget:'23:00',glassMl:250},read(SKEY,{}));
const persist=()=>write(KEY,db), saveS=()=>write(SKEY,S);

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function h(tag,a,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const today=iso(new Date());
const has=(e,k)=>{if(k==='scr')return has(e,'scrH')||has(e,'scrM');const v=e[k];return v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)};
const num=v=>v==null||v===''||isNaN(+v)?null:+v;
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const sd=a=>{a=a.filter(x=>x!=null);if(a.length<2)return null;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const mins=t=>{if(!t)return null;const[h,m]=String(t).split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const pad=n=>String(n).padStart(2,'0');
const clock=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const fmtDur=m=>{if(m==null)return '–';m=Math.round(m);const hh=Math.floor(m/60),mm=m%60;return hh?hh+'h'+(mm?' '+pad(mm)+'m':''):mm+'m'};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayLabel=k=>new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});

/* ---------- metrics ---------- */
function sleepMins(e){const b=mins(e.bed),w=mins(e.wake);if(b==null||w==null)return null;let d=w-b;if(d<=0)d+=1440;return d}
function sleepScore(e){
  const d=sleepMins(e);if(d==null)return null;const hrs=d/60;
  const dur=hrs>=7&&hrs<=9?100:hrs<7?Math.max(0,100-(7-hrs)*25):Math.max(0,100-(hrs-9)*25);
  const parts=[[40,dur]];
  if(num(e.latency)!=null)parts.push([20,Math.max(0,100-Math.max(0,num(e.latency)-15)*3)]);
  if(num(e.wakeups)!=null)parts.push([15,Math.max(0,100-num(e.wakeups)*35)]);
  if(num(e.wakeFeel)!=null)parts.push([25,(num(e.wakeFeel)-1)*25]);
  const tw=parts.reduce((a,p)=>a+p[0],0);
  return Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/tw);
}
const bedAbs=e=>{const m=mins(e&&e.bed);return m==null?null:m<720?m+1440:m};
const screenMin=e=>has(e,'scr')?(num(e.scrH)||0)*60+(num(e.scrM)||0):null;
const energy=e=>avg([e.enM,e.enA,e.enE].map(num));
function screenGap(k){ // minutes between last screen on day k and bedtime that night (logged in next day's entry)
  const e=db[k]||{},n=db[addDays(k,1)]||{};const l=mins(e.lastScreen),b=mins(n.bed);
  if(l==null||b==null)return null;const g=(b-l+1440)%1440;return g>720?0:g;
}
function completion(e){
  let f=0,t=0;SECTIONS.forEach(s=>{if(!s.core)return;t+=s.core.length;f+=s.core.filter(k=>has(e,k)).length});
  return t?Math.round(f/t*100):0;
}

/* ---------- schema ---------- */
const SECTIONS=[
  {id:'sleep',t:'Sleep',sub:'Fill in after you wake up',core:['bed','wake','latency','wakeups','wakeFeel']},
  {id:'food',t:'Food & drink',sub:'Log each meal as you eat',core:['breakfast_i','lunch_i','dinner_i','water']},
  {id:'mind',t:'Energy & mood',sub:'Quick taps through the day',core:['enM','enA','enE','mood','stress']},

function lineChart(pts,n,o){

  if(!vals.length)return h('div',{class:'empty'},'No data yet');

  if(o.ref!=null)s+=`<line class="ref" x1="${L}" x2="${W-R}" y1="${y(o.ref)}" y2="${y(o.ref)}"/><text class="ax" x="${W-R}" y="${y(o.ref)-4}" text-anchor="end">goal</text>`;
  [1,8,15,22,29].filter(d=>d<=n).forEach(d=>{s+=`<text class="ax" x="${x(d)}" y="${H-6}" text-anchor="middle">${d}</text>`});

}

  if(ea.length>=2&&eb.length>=2)out.push(`Energy on exercise days ${f1(avg(ea.map(x=>energy(x.e))))}/5 vs ${f1(avg(eb.map(x=>energy(x.e))))}/5 on rest days.`);
  // sleep >=7h vs mood
  const sm=days.filter(x=>sleepMins(x.e)!=null&&num(x.e.mood)!=null),sa=sm.filter(x=>sleepMins(x.e)>=420),sb=sm.filter(x=>sleepMins(x.e)<420);
  if(sa.length>=2&&sb.length>=2)out.push(`Mood after 7h+ sleep ${f1(avg(sa.map(x=>num(x.e.mood))))}/5 vs ${f1(avg(sb.map(x=>num(x.e.mood))))}/5 after less.`);
  // screen time vs sleep
  const st=days.map(x=>({t:screenMin(x.e),s:sleepScore(db[addDays(x.k,1)]||{})})).filter(o=>o.t!=null&&o.s!=null);
  if(st.length>=4){const med=[...st].sort((a,b)=>a.t-b.t)[Math.floor(st.length/2)].t,hi=st.filter(o=>o.t>=med),lo=st.filter(o=>o.t<med);
    if(hi.length>=2&&lo.length>=2)out.push(`On days with more than ${fmtDur(med)} of screen time, the next night's sleep score was ${Math.round(avg(hi.map(o=>o.s)))} vs ${Math.round(avg(lo.map(o=>o.s)))} on lighter days.`)}
  // bedtime regularity
  const bs=sd(days.map(x=>bedAbs(x.e)));if(bs!=null&&days.filter(x=>x.e.bed).length>=5)out.push(`Your bedtime varied by ±${Math.round(bs)} min. Under ±30 min is considered regular.`);
  // best night
  const best=days.filter(x=>sleepScore(x.e)!=null).sort((a,b)=>sleepScore(b.e)-sleepScore(a.e))[0];
  if(best&&days.length>=5)out.push(`Best night: ${dayLabel(best.k)} — slept ${fmtDur(sleepMins(best.e))}, bed at ${best.e.bed}.`);
  return out;
}
function renderInsights(){
  const root=$('#view-insights');root.replaceChildren();
  const[y,m]=mo.split('-').map(Number),n=new Date(y,m,0).getDate();
  const days=monthDays(mo),prevM=shiftMonth(mo,-1),pdays=monthDays(prevM),pn=monthName(prevM,{month:'short'});
  root.append(h('div',{class:'card mnav'},
    h('button',{class:'icon-btn',type:'button','aria-label':'Previous month',onclick(){mo=prevM;renderInsights()}},'‹'),
    h('h2',{},monthName(mo)),
    h('button',{class:'icon-btn',type:'button','aria-label':'Next month',disabled:mo>=today.slice(0,7),onclick(){mo=shiftMonth(mo,1);renderInsights()}},'›')));
  if(!days.length){root.append(h('div',{class:'card empty'},'Nothing logged in '+monthName(mo)+' yet.'));return}

  const bedL=ds=>ds.map(x=>bedAbs(x.e));
  const T=[
    {l:'Days logged',f:ds=>ds.length,fmt:v=>v+' / '+n,sub:()=>'avg '+Math.round(avg(days.map(x=>completion(x.e))))+'% complete'},
    {l:'Avg sleep',f:ds=>avg(ds.map(x=>sleepMins(x.e))),fmt:fmtDur,df:v=>fmtDur(Math.abs(v))},
    {l:'Sleep score',f:ds=>avg(ds.map(x=>sleepScore(x.e))),fmt:v=>String(Math.round(v)),df:v=>Math.abs(Math.round(v))+' pts'},
    {l:'Avg bedtime',f:ds=>avg(bedL(ds)),fmt:clock,df:v=>fmtDur(Math.abs(v)),w:['later','earlier']},
    {l:'Bedtime regularity',f:ds=>sd(bedL(ds)),fmt:v=>'±'+Math.round(v)+' min',df:v=>Math.abs(Math.round(v))+' min',w:['less regular','more regular']},
    {l:'Screen time',f:ds=>avg(ds.map(x=>screenMin(x.e))),fmt:fmtDur,df:v=>fmtDur(Math.abs(v))},
    {l:'Energy',f:ds=>avg(ds.map(x=>energy(x.e))),fmt:v=>v.toFixed(1)+' / 5',df:v=>Math.abs(v).toFixed(1)},
    {l:'Mood',f:ds=>avg(ds.map(x=>num(x.e.mood))),fmt:v=>v.toFixed(1)+' / 5',df:v=>Math.abs(v).toFixed(1)},
    {l:'Stress',f:ds=>avg(ds.map(x=>num(x.e.stress))),fmt:v=>v.toFixed(1)+' / 5',df:v=>Math.abs(v).toFixed(1)},
    {l:'Water',f:ds=>avg(ds.map(x=>num(x.e.water))),fmt:v=>v.toFixed(1)+' glasses',df:v=>Math.abs(v).toFixed(1)},
    {l:'Exercise days',f:ds=>ds.some(x=>has(x.e,'exercise'))?ds.filter(x=>num(x.e.exercise)>0).length:null,fmt:v=>v+' days',df:v=>Math.abs(v)+' days'},
    {l:'Habits done',f:habitPct,fmt:v=>Math.round(v)+'%',df:v=>Math.abs(Math.round(v))+' pts'},
  ];
  const tiles=h('div',{class:'tiles'});
  T.forEach(t=>{const v=t.f(days);if(v==null)return;const pv=t.df?t.f(pdays):null;let sub=t.sub?t.sub():'';
    if(pv!=null){const d=v-pv;sub=Math.abs(d)<1e-9?'same as '+pn:(d>0?'↑ ':'↓ ')+t.df(d)+' '+(t.w?(d>0?t.w[0]:t.w[1]):'vs '+pn)}
    tiles.append(h('div',{class:'tile'},h('span',{class:'tl'},t.l),h('b',{},t.fmt(v)),h('span',{class:'td'},sub||' ')))});
  root.append(h('section',{class:'card'},h('div',{class:'card-h'},h('div',{},h('h2',{},'Month at a glance'),h('p',{class:'sub'},pdays.length?'Arrows compare with '+monthName(prevM,{month:'long'}):'Next month you’ll see changes vs this month'))),tiles));

  // heatmap
  const hmBox=h('div',{});
  const hmChips=h('div',{class:'chips sm',style:'margin-bottom:10px'},...Object.entries(HEAT).map(([k,c])=>h('button',{type:'button',class:'chip'+(k===heat?' on':''),onclick(){heat=k;[...hmChips.children].forEach(b=>b.classList.toggle('on',b===this));hmBox.replaceChildren(heatmap(mo,days))}},c.l)));
  hmBox.append(heatmap(mo,days));
  root.append(h('section',{class:'card'},h('h3',{},'Calendar'),h('p',{class:'cap'},'Tap a day to open it.'),hmChips,hmBox));

  // charts
  const pts=(f,tf)=>days.map(x=>{const v=f(x.e);return{d:x.d,k:x.k,v,tip:v==null?'':dayLabel(x.k)+'\n'+tf(v,x.e)}});
  const C=(title,cap,el)=>root.append(h('section',{class:'card'},h('h3',{},title),h('p',{class:'cap'},cap),el));
  C('Sleep duration','Shaded band = healthy 7–9 h. Dashed line = your goal.',lineChart(pts(e=>{const d=sleepMins(e);return d==null?null:d/60},(v,e)=>'Slept '+fmtDur(v*60)+' · score '+sleepScore(e)),n,{min:4,max:10,band:[7,9],ref:S.sleepTarget,fmt:v=>v+'h',ticks:[4,6,8,10],label:'Sleep hours by day'}));
  C('Bedtime','Higher = later. A flat line means a regular rhythm.',lineChart(pts(bedAbs,v=>'Bed at '+clock(v)),n,{ref:bedAbs({bed:S.bedTarget}),tickStep:30,fmt:clock,label:'Bedtime by day'}));
  C('Screen time','Total daily screen time from your phone.',lineChart(pts(e=>{const t=screenMin(e);return t==null?null:t/60},(v,e)=>fmtDur(v*60)+(num(e.pickups)!=null?' · '+e.pickups+' pickups':'')),n,{min:0,floor:0,tickStep:1,fmt:v=>Math.round(v*10)/10+'h',label:'Screen time by day'}));
  C('Energy','Average of morning, afternoon and evening (1–5).',lineChart(pts(energy,v=>'Energy '+v.toFixed(1)+'/5'),n,{min:1,max:5,ticks:[1,2,3,4,5],fmt:v=>String(v),label:'Energy by day'}));
  C('Mood','Overall mood (1–5).',lineChart(pts(e=>num(e.mood),v=>'Mood '+v+'/5'),n,{min:1,max:5,ticks:[1,2,3,4,5],fmt:v=>String(v),label:'Mood by day'}));
  C('Water','Glasses per day.',lineChart(pts(e=>num(e.water),v=>v+' glasses'),n,{min:0,floor:0,ref:8,tickStep:2,fmt:v=>String(Math.round(v)),label:'Water by day'}));

  // habits
  if(S.habits.length){
    root.append(h('section',{class:'card'},h('h3',{},'Habits'),h('p',{class:'cap'},'Share of logged days each habit was done.'),
      ...S.habits.map(nm=>{const c=days.filter(x=>x.e.habits&&x.e.habits[nm]).length,p=Math.round(c/days.length*100);
        return h('div',{class:'hb','data-tip':nm+'\n'+c+' of '+days.length+' days'},h('span',{},nm),h('div',{class:'bar'},h('i',{style:'width:'+p+'%'})),h('b',{},p+'%'))})));
  }

  // findings
  const fs=findings(days);
  root.append(h('section',{class:'card'},h('h3',{},'Patterns'),h('p',{class:'cap'},'Simple comparisons from your own data. They need a couple of weeks of logs to show up.'),
    fs.length?h('ul',{class:'ins'},...fs.map(t=>h('li',{},t))):h('p',{class:'hint'},'Keep logging. Patterns appear once there are at least 2 days in each group to compare.')));

  // table
  const tb=h('tbody',{},...days.map(x=>{const e=x.e;return h('tr',{onclick:()=>openDay(x.k)},
    h('td',{},new Date(x.k+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})),
    h('td',{},fmtDur(sleepMins(e))),h('td',{},sleepScore(e)??'–'),h('td',{},e.bed||'–'),
    h('td',{},fmtDur(screenMin(e))),h('td',{},energy(e)==null?'–':energy(e).toFixed(1)),h('td',{},e.mood??'–'),
    h('td',{},e.water??'–'),h('td',{},e.exercise!=null?e.exercise+'m':'–'),h('td',{},completion(e)+'%'))}));
  root.append(h('section',{class:'card'},h('h3',{},'All days'),h('p',{class:'cap'},'Tap a row to open or edit that day.'),
    h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},...['Day','Sleep','Score','Bed','Screen','Energy','Mood','Water','Exercise','Logged'].map(t=>h('th',{},t)))),tb))));
}
function openDay(k){if(k>today)return;show('log');go(k)}

/* ---------- settings ---------- */
function dl(name,text,type){const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});document.body.append(a);a.click();a.remove()}
function exportCSV(){
  const keys=new Set();Object.values(db).forEach(e=>Object.keys(e).forEach(k=>k!=='habits'&&keys.add(k)));
  const hab=new Set(S.habits);Object.values(db).forEach(e=>e.habits&&Object.keys(e.habits).forEach(n=>hab.add(n)));
  const cols=['date','completion','sleepHours','sleepScore','screenMinutes',...[...keys].sort(),...[...hab].map(n=>'habit: '+n)];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=Object.keys(db).sort().map(k=>{const e=db[k],d=sleepMins(e);return cols.map(c=>
    c==='date'?k:c==='completion'?completion(e):c==='sleepHours'?(d==null?'':(d/60).toFixed(2)):c==='sleepScore'?sleepScore(e)??'':c==='screenMinutes'?screenMin(e)??'':
    c.startsWith('habit: ')?(e.habits&&e.habits[c.slice(7)]?1:0):Array.isArray(e[c])?e[c].join(' | '):e[c]).map(q).join(',')});
  dl('daily-log-'+today+'.csv',[cols.map(q).join(','),...rows].join('\n'),'text/csv');
}
function renderSettings(){
  const root=$('#view-settings');root.replaceChildren();
  // habits
  const list=h('div',{});
  const paint=()=>list.replaceChildren(...S.habits.map((nm,i)=>h('div',{class:'hrow'},h('span',{},nm),
    i>0&&h('button',{class:'icon-btn',type:'button','aria-label':'Move up',onclick(){[S.habits[i-1],S.habits[i]]=[S.habits[i],S.habits[i-1]];saveS();paint()}},'↑'),
    h('button',{class:'icon-btn',type:'button','aria-label':'Remove '+nm,onclick(){S.habits.splice(i,1);saveS();paint()}},'✕'))));
  paint();
  const inp=h('input',{type:'text',placeholder:'e.g. Read 10 pages',maxlength:60});
  const add=()=>{const v=inp.value.trim();if(v&&!S.habits.includes(v)){S.habits.push(v);saveS();inp.value='';paint()}};
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')add()});
  root.append(h('section',{class:'card'},h('div',{class:'card-h'},h('div',{},h('h2',{},'Habits'),h('p',{class:'sub'},'Your daily checklist. Removing one keeps its history.'))),
    list,h('div',{class:'tf',style:'margin-top:10px'},inp,h('button',{class:'btn primary',type:'button',onclick:add},'Add'))));
  // targets
  const sf=(k,attrs,parse)=>{const el=h('input',attrs);el.value=S[k];el.addEventListener('change',()=>{const v=parse(el.value);if(v!=null&&v!==''){S[k]=v;saveS()}else el.value=S[k]});return el};
  root.append(h('section',{class:'card'},h('div',{class:'card-h'},h('div',{},h('h2',{},'Goals'),h('p',{class:'sub'},'Used for the goal lines and comparisons.'))),
    h('div',{class:'two'},field('Sleep goal (hours)',sf('sleepTarget',{type:'number',step:0.5,min:4,max:12,inputmode:'decimal'},v=>v===''?null:Math.min(12,Math.max(4,+v)))),
      field('Bedtime goal',sf('bedTarget',{type:'time'},v=>v||null))),
    field('Glass size (ml)',sf('glassMl',{type:'number',step:50,min:50,max:1000,inputmode:'numeric'},v=>v===''?null:Math.max(50,+v)))));
  // data
  const file=h('input',{type:'file',accept:'application/json,.json',hidden:true});
  file.addEventListener('change',async()=>{const f=file.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());const entries=o&&o.entries?o.entries:o;if(typeof entries!=='object'||Array.isArray(entries))throw 0;
      if(o.settings)S=Object.assign(S,o.settings),saveS();db={...db,...entries};persist();alert('Restored '+Object.keys(entries).length+' days.');renderSettings()}
    catch(e){alert('That file is not a valid Daily Log backup.')}file.value=''});
  const n=Object.keys(db).length;
  root.append(h('section',{class:'card'},h('div',{class:'card-h'},h('div',{},h('h2',{},'Your data'),h('p',{class:'sub'},n+' day'+(n===1?'':'s')+' saved in this browser'))),
    h('div',{class:'prose'},h('p',{},'Everything is stored only on this device, in this browser. It survives refreshes and closing the app, but not clearing site data, private/incognito windows, or switching phone/browser.'),
      h('p',{},'Tap “Backup” once a week and keep the file (e.g. in Google Drive). “Restore” brings it back on any device.')),
    h('div',{class:'row',style:'margin-top:10px'},
      h('button',{class:'btn primary',type:'button',onclick:()=>dl('daily-log-backup-'+today+'.json',JSON.stringify({entries:db,settings:S},null,1),'application/json')},'Backup'),
      h('button',{class:'btn',type:'button',onclick:()=>file.click()},'Restore'),
      h('button',{class:'btn',type:'button',onclick:exportCSV},'Export CSV'),file),
    h('div',{class:'row',style:'margin-top:16px'},h('button',{class:'btn danger',type:'button',onclick(){if(confirm('Delete ALL logged days from this browser? Make a backup first.')&&confirm('Really delete everything? This cannot be undone.')){db={};persist();renderSettings()}}},'Delete all data'))));
  root.append(h('section',{class:'card prose'},h('h3',{},'How the sleep score works'),
    h('p',{},'0–100, from: 40% sleep duration (full marks for 7–9 h), 20% time to fall asleep (full marks under 15 min), 15% night wake-ups, 25% how you felt on waking. Missing answers are left out rather than counted as bad.'),
    h('p',{},'Tip: log sleep right after waking, and screen time just before bed, so you’re recalling, not guessing.')));
}

/* ---------- views ---------- */
function show(v){
  view=v;['log','insights','settings'].forEach(x=>{$('#view-'+x).hidden=x!==v;$('#nav-'+x).classList.toggle('on',x===v)});
  $('#tip').hidden=true;
  if(v==='log')go(cur);else if(v==='insights')renderInsights();else renderSettings();
  window.scrollTo({top:0});
}
$('#nav-log').onclick=()=>show('log');
$('#nav-insights').onclick=()=>{mo=cur.slice(0,7);show('insights')};
$('#nav-settings').onclick=()=>show('settings');
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='insights')renderInsights()},200)});

/* ---------- tooltips ---------- */
const tip=$('#tip');
function showTip(t){tip.textContent=t.dataset.tip;tip.hidden=false;const r=t.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2))+'px';let top=r.top-th-8;if(top<8)top=r.bottom+8;tip.style.top=top+'px'}
document.addEventListener('pointerover',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t);else tip.hidden=true});
document.addEventListener('focusin',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t)});
window.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});

go(today);
</script>
